const ABAS=[['geral','Geral'],['enc','Encomendas'],['semana','Semana'],['precos','Preços'],['feira','Feira'],['ajustes','Ajustes']];
function render(anim){const vt=anim&&document.startViewTransition&&!matchMedia('(prefers-reduced-motion:reduce)').matches;vt?document.startViewTransition(pinta):pinta()}
function pinta(){document.body.dataset.aba=ui.aba;focoFixo='';
  $('#nav').innerHTML=ABAS.map(([k,l])=>`<button data-a="aba" data-k="${k}" ${ui.aba===k?'aria-current="page"':''}>${l}</button>`).join('');
  $('#app').innerHTML=({geral:vGeral,enc:vEnc,precos:vPrecos,semana:vSemana,feira:()=>'<div id="kit"></div>',ajustes:vAjustes}[ui.aba]||vGeral)();
  dRua();dPrecos();dSemana();if($('#kit'))Kit.monta($('#kit'));guardaUi()}
function fechar(){document.body.classList.remove('g');sel=null;const y=scrollY;render();scrollTo(0,y)}
const A={
  aba(e){ui.aba=e.dataset.k;render(1);scrollTo(0,0)},
  modo(e){ui.modo=e.dataset.k;$$('[data-a=modo]').forEach(b=>b.setAttribute('aria-pressed',b===e));dRua();guardaUi()},
  simpx(e){ui.sim.px=+e.dataset.k;render()},
  ver(e){ui.ver=e.dataset.k;render(1)},
  filtro(e){ui.filtro=e.dataset.k;ui.mes='';render()},
  mes(e){ui.mes=e.dataset.k;if(ui.mes){ui.aba='enc';ui.ver='tabela';ui.ord='valor';ui.desc=true}render(1);scrollTo(0,0)},
  ord(e){const k=e.dataset.k;ui.desc=ui.ord===k?!ui.desc:false;ui.ord=k;render()},
  pausa(){ui.pausa=!ui.pausa;render()},
  abrir(e){abrir(e.dataset.id)},
  fechar,
  nova(){const p={id:uid(),n:Math.max(0,...S.pedidos.map(p=>p.n||0))+1,nome:'',andamento:'Fila',cidade:'',contato:HOJE,tamanho:'',tecnicas:['Aquarela'],tags:[],entregue:'',pgto:'Pix',obs:'',pago:'Sinal',prazoIni:'',prazoFim:'',valor:0};
    S.pedidos.push(p);salvar();ui.aba='enc';render();abrir(p.id);setTimeout(()=>$('#gav .nome')?.focus(),260)},
  set(e){const f=e.dataset.f;sel[f]=sel[f]===e.dataset.k&&f==='tamanho'?'':e.dataset.k;if(f==='andamento'&&sel.andamento==='Entregue'&&!sel.entregue)sel.entregue=HOJE;if(f==='andamento'&&sel.andamento==='Entregue'&&sel.pago==='Sinal')sel._=0;salvar();gaveta()},
  alt(e){const f=e.dataset.f,k=e.dataset.k;sel[f]=sel[f]||[];const i=sel[f].indexOf(k);i<0?sel[f].push(k):sel[f].splice(i,1);salvar();gaveta()},
  usar(e){sel.valor=+e.dataset.k;salvar();gaveta()},
  estr(e){S.precos.plano=Object.assign(S.precos.plano||{},{estr:e.dataset.k});salvar();render()},
  avanca(e){const p=S.pedidos.find(x=>x.id===e.dataset.id),i=ETAPAS.indexOf(p.andamento);if(i>=0&&ETAPAS[i+1]){p.andamento=ETAPAS[i+1];salvar();render(1)}},
  entrega(e){const p=S.pedidos.find(x=>x.id===e.dataset.id);p.andamento='Entregue';if(!p.entregue)p.entregue=HOJE;salvar();render(1)},
  foto(){foto()}, fotoobs(){fotoObs=!fotoObs;foto()}, fotofecha(){$('#foto')?.remove()},
  apagar1(){$('#apagar').innerHTML='<span class="muted">Apagar de vez? </span><button class="btn p s" data-a="apagar2">Sim, apagar</button> <button class="btn q s" data-a="reabrir">Manter</button>'},
  reabrir(){gaveta()},
  apagar2(){S.pedidos=S.pedidos.filter(p=>p!==sel);salvar();fechar()},
  mold(e){ui.moldura=!!e.dataset.k;render()},
  ipca(){ui.reaj=Math.min(30,Math.round((+S.precos.ipca||0)*2)/2);$('#reaj').value=ui.reaj;dPrecos();guardaUi()},
  aplicar(){const t=tabela(),f=1+ui.reaj/100,nt=Object.fromEntries(TP.map(k=>[k,t.t[k].map(v=>arred(v*f))]));
    if(t.data===HOJE)t.t=nt;else S.precos.versoes.push({data:HOJE,t:nt});S.precos.ipca=0;ui.reaj=0;salvar();render()},
  sim(e){ui.sim.t=e.dataset.k;render()}, simb(e){ui.sim[e.dataset.f]=!ui.sim[e.dataset.f];render()},
  async conectar(){const u=$('#purl').value.trim(),k=$('#psen').value.trim(),m=$('#tokm');if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){m.textContent='Cole o link do App da Web, que termina em /exec.';return}if(!k){m.textContent='Digite a senha do script.';return}m.textContent='Conectando…';
    try{await conectar(u,k);render()}catch(err){conta={};m.textContent=err.message+'.'}},
  sair(){conta={};localStorage.removeItem(LSC);estado('off','Salvo neste aparelho');render()},
  csv(){baixar('encomendas-uns-predinhos.csv',csv(),'text/csv;charset=utf-8')},
  json(){baixar('gestao-uns-predinhos-'+HOJE+'.json',JSON.stringify(S),'application/json')}
};
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-a]');if(!e)return;A[e.dataset.a]?.(e,ev)});
document.addEventListener('input',ev=>{const e=ev.target,d=e.dataset;
  if(e.id==='busca'){ui.busca=e.value;const pos=e.selectionStart;render();const n=$('#busca');n.focus();n.setSelectionRange(pos,pos);return}
  if(e.id==='ftag'){ui.tag=e.value;render();return}
  if(d.f){campo(e);return}
  if(d.pv){const[k,i]=d.pv.split('.');tabela().t[k][+i]=+e.value||0;salvar();dPrecos();return}
  if(d.pc){const[k,c]=d.pc.split('.');S.precos.custos[k][c]=+e.value||0;salvar();dPrecos();return}
  if('ipca' in d){S.precos.ipca=+e.value||0;salvar();dPrecos();return}
  if(e.id==='cap'){S.precos.plano=Object.assign(S.precos.plano||{},{cap:+e.value});salvar();dSemana();return}
  if(e.id==='reaj'){ui.reaj=+e.value;dPrecos();guardaUi();return}
    if('pressa' in d){S.precos.pressa=+e.value||0;salvar()}});
document.addEventListener('change',ev=>{const e=ev.target;
  if(e.id==='imp'&&e.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.pedidos))throw 0;S=Object.assign(PADRAO(),{precos:S.precos,feira:S.feira},j);completa();salvar();ui.aba='geral';render()}catch(x){$('#impm').textContent='Esse arquivo não tem o formato do sistema. Use o JSON de cópia completa ou o encomendas-notion.json.'}};r.readAsText(e.files[0])}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#foto')){$('#foto').remove();return}if(e.key==='Escape'&&document.body.classList.contains('g'))fechar();
  if(e.key==='Enter'&&e.target.id==='novatag'&&sel){const t=e.target.value.trim();if(t){sel.tags=sel.tags||[];if(!tem(sel,t))sel.tags.push(t);salvar();gaveta();$('#novatag').focus()}}});
/* arrastar cartões no quadro */
let arr=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('.card');if(c){arr=c.dataset.id;e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const c=e.target.closest?.('.col');if(c&&arr){e.preventDefault();$$('.col.sobre').forEach(x=>x!==c&&x.classList.remove('sobre'));c.classList.add('sobre')}});
document.addEventListener('drop',e=>{const c=e.target.closest?.('.col');if(c&&arr){e.preventDefault();const p=S.pedidos.find(x=>x.id===arr);if(p&&p.andamento!==c.dataset.col){p.andamento=c.dataset.col;if(p.andamento==='Entregue'&&!p.entregue)p.entregue=HOJE;salvar()}arr=null;render()}});
document.addEventListener('dragend',()=>{arr=null;$$('.col.sobre').forEach(x=>x.classList.remove('sobre'))});
/* dica flutuante */
const tip=$('#tip');
document.addEventListener('pointermove',e=>{const t=e.target.closest?.('[data-tip]');if(!t||e.pointerType==='touch'&&!t.closest('svg')){tip.style.opacity=0;return}
  tip.textContent=t.dataset.tip;tip.style.opacity=1;const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,Math.max(8,e.clientX+14))+'px';tip.style.top=Math.max(8,e.clientY-tip.offsetHeight-12)+'px'});
document.addEventListener('pointerleave',()=>tip.style.opacity=0,true);

/* rua: foco pelas palavras do título, leitura das janelas, barras deslizantes, cursor */
document.addEventListener('pointerover',e=>{const t=e.target;if(!t.closest)return;
  const h=t.closest('[data-foco].hot');if(h&&$('#rua'))$('#rua').dataset.foco=h.dataset.foco;
  const j=t.closest('.j');if(j&&$('#leitura'))$('#leitura').innerHTML=j.dataset.l;
  const b=t.closest('#scrub i');if(b){const x=fatD[+b.dataset.i];$$('#scrub i.on').forEach(o=>o.classList.remove('on'));b.classList.add('on');$('#scn').textContent=brl(x.v);$('#scl').textContent=`${x.r}, em ${x.n} pedidos`}
  $('#cur').classList.toggle('on',!!t.closest('button,a,[data-a],input[type=range],select,label.btn'))});
document.addEventListener('pointerout',e=>{const t=e.target;if(!t.closest)return;
  if(t.closest('[data-foco].hot')&&$('#rua'))$('#rua').dataset.foco=focoFixo;
  if(t.closest('.j')&&$('#leitura'))$('#leitura').textContent=LEIT;
  if(t.closest('#scrub')&&!e.relatedTarget?.closest?.('#scrub')){$$('#scrub i.on').forEach(o=>o.classList.remove('on'));$('#scn').textContent=fatPad[0];$('#scl').textContent=fatPad[1]}});
document.addEventListener('click',e=>{const h=e.target.closest?.('[data-foco].hot');if(!h)return;focoFixo=focoFixo===h.dataset.foco?'':h.dataset.foco;$('#rua').dataset.foco=focoFixo;$$('.hot').forEach(x=>x.classList.toggle('fx',x.dataset.foco===focoFixo))});
if(matchMedia('(hover:hover) and (pointer:fine)').matches){const c=$('#cur');c.style.display='block';addEventListener('pointermove',e=>{c.style.transform=`translate(${e.clientX}px,${e.clientY}px)`},{passive:true})}
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(dRua,150)});
/* ============ início ============ */
if(!S.pedidos.length&&!conta.url)ui.aba='ajustes';
estado(conta.url?'':'off',conta.url?'Salvo na planilha':'Salvo neste aparelho');
if(!['geral','enc','semana','precos','feira','ajustes'].includes(ui.aba))ui.aba='geral';
render();puxar();
</script>
</body>
</html>
